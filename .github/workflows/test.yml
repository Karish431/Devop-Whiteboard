name: Test and Promote to Test Stage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test suite
        run: python -m unittest test_session_export.py -v

  promote-to-test:
    name: Run Export Against Test Environment
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export session summary (Test stage)
        run: python session_export.py --board-id BOARD-001 --env test --output output/session_summary.md

      - name: Show generated summary
        run: cat output/session_summary.md

      - name: Upload summary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-summary-test-stage
          path: output/session_summary.md
